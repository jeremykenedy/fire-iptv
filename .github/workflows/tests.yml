name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'art/**', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'art/**', 'docs/**']

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 scripts/catalog.py --check
      - run: flutter analyze
      - run: flutter test
      # This compile check uses a temporary debug key. Published APKs are
      # built separately with the stable private release key.
      - run: flutter build apk --release --target-platform android-arm,android-arm64
