name: open_iptv
description: A TV guide, sports hub, and personal streaming library for Fire TV.
publish_to: none
version: 1.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  drift: ^2.18.0
  path_provider: ^2.1.3

  # Navigation
  go_router: ^13.2.0

  # Networking
  http: ^1.2.1

  # XML (XMLTV parsing)
  xml: ^6.5.0

  # Images
  cached_network_image: ^3.3.1

  # Encryption (AES-256 for backup PIN)
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Archive (.iptvprofile ZIP)
  archive: ^3.6.1

  # Background audio
  audio_service: ^0.18.12

  # File operations
  file_picker: ^11.0.0
  share_plus: ^12.0.0
  path: ^1.9.0

  # App metadata
  package_info_plus: ^8.0.0

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # Background auto-refresh
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  sqlcipher_flutter_libs: ^0.6.8
  # Registers the app's native channels on every engine (Android Auto).
  engine_hooks:
    path: packages/engine_hooks
  # SQLCipher-compatible API (opening/encrypting the database); also used
  # by DB tests to load the host's libsqlite3.
  sqlite3: ^2.9.4
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  # Brand artwork sources: assets/branding/ (see its README).
  image_path: "assets/branding/png/app_icon.png"
  adaptive_icon_background: "assets/branding/png/icon_background.png"
  adaptive_icon_foreground: "assets/branding/png/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/png/icon_monochrome.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#101C30"
  image: assets/branding/png/splash_mark.png
  branding: assets/images/wordmark.png
  branding_bottom_padding: 48
  android: true
  ios: false
  android_12:
    color: "#101C30"
    image: assets/branding/png/splash_mark.png
    branding: assets/images/wordmark.png

flutter:
  uses-material-design: true

  # Google Sans (SIL OFL 1.1 — assets/fonts/google_sans/OFL.txt), subset to
  # Latin, Greek and Cyrillic; other scripts fall back to the system font.
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/google_sans/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/google_sans/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google_sans/GoogleSans-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/catalog/
